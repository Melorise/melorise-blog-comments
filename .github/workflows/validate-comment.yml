name: 0721c validate comment
# The default-main workflow reads PR data through REST; it never executes PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [comments]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Review PR number to validate against its actual head
        required: true
        type: string
permissions: {}
concurrency:
  group: 0721c-validate-${{ github.event.pull_request.number || inputs.pr_number }}
  queue: max
jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted main runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      # Intake validates too: the default GITHUB_TOKEN may not trigger this workflow.
      - name: Validate JSON and write actual head status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: RUNTIME_MAIN_SHA="$(git rev-parse HEAD)" node .0721c/runtime/automation/validate-comment.mjs
