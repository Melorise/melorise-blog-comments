name: 0721c intake comment
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to convert or retry
        required: true
        type: string
permissions: {}
concurrency:
  group: 0721c-intake-${{ github.event.issue.number || inputs.issue_number }}
  queue: max
jobs:
  intake:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted main runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Save candidate, create review PR, validate and close Issue
        env:
          GITHUB_TOKEN: ${{ secrets.COMMENTS_TOKEN || github.token }}
        run: RUNTIME_MAIN_SHA="$(git rev-parse HEAD)" node .0721c/runtime/automation/intake-comment.mjs
