name: 0721c publish index
on:
  pull_request_target:
    types: [closed]
    branches: [comments]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main, comments]
permissions: {}
# Every trigger uses the same queue; cron/manual also recover missed events.
concurrency:
  group: 0721c-publish-index
  queue: max
jobs:
  publish:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted main runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Regenerate full index tree and replace index branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: RUNTIME_MAIN_SHA="$(git rev-parse HEAD)" node .0721c/runtime/automation/publish-index.mjs
